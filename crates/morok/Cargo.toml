[package]
name = "morok"
description = "A macOS UI kit that renders the whole interface through Metal: components driven by signals, styled by compiled CSS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
morok-components.workspace = true
morok-core.workspace = true
morok-platform.workspace = true
morok-reactive.workspace = true
morok-style.workspace = true

[dev-dependencies]
morok-css.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "NSApplication",
  "NSColor",
  "NSDragging",
  "NSEvent",
  "NSGraphicsContext",
  "NSMenu",
  "NSMenuItem",
  "NSPasteboard",
  "NSResponder",
  "NSScreen",
  "NSView",
  "NSVisualEffectView",
  "NSWindow",
] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = [
  "CGBitmapContext",
  "CGColorSpace",
  "CGContext",
  "CGImage",
  "CGWindow",
] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSDate",
  "NSGeometry",
  "NSNotification",
  "NSObjCRuntime",
  "NSRunLoop",
  "NSString",
] }

[[test]]
name = "button_interaction"
harness = false

[[test]]
name = "drag_windows"
harness = false

[[test]]
name = "images"
harness = false

[[test]]
name = "multiple_windows"
harness = false

[[test]]
name = "overlay_windows"
harness = false
