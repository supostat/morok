[package]
name = "morok-platform"
description = "macOS platform layer of the morok UI kit: windows, the Metal 4 renderer and the frame loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
accesskit_macos.workspace = true
bytemuck.workspace = true
dispatch2 = { workspace = true, features = ["block2", "objc2"] }
resvg.workspace = true
unicode-segmentation.workspace = true
morok-core.workspace = true
morok-style.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "NSAccessibility",
  "NSAppearance",
  "NSApplication",
  "NSEvent",
  "NSFont",
  "NSFontDescriptor",
  "NSGraphics",
  "NSPasteboard",
  "NSResponder",
  "NSRunningApplication",
  "NSTextInputClient",
  "NSTextInputContext",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
  "NSWorkspace",
  "objc2-core-foundation",
  "objc2-quartz-core",
] }
objc2-core-foundation = { workspace = true, features = [
  "CFArray",
  "CFAttributedString",
  "CFCGTypes",
  "CFDictionary",
  "CFLocale",
  "CFNumber",
  "CFString",
  "CFStringTokenizer",
] }
objc2-core-graphics = { workspace = true, features = [
  "CGBitmapContext",
  "CGColorSpace",
  "CGContext",
  "CGDataProvider",
  "CGFont",
  "CGImage",
] }
objc2-core-text = { workspace = true, features = [
  "CTFont",
  "CTFontDescriptor",
  "CTFontTraits",
  "CTLine",
  "CTRun",
  "CTStringAttributes",
  "CTTypesetter",
  "objc2-core-graphics",
] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSAttributedString",
  "NSDate",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSNotification",
  "NSObjCRuntime",
  "NSRange",
  "NSRunLoop",
  "NSString",
] }
objc2-image-io = { workspace = true, features = ["CGImageSource", "objc2-core-graphics"] }
objc2-metal = { workspace = true, features = [
  "MTL4ArgumentTable",
  "MTL4CommandAllocator",
  "MTL4CommandBuffer",
  "MTL4CommandEncoder",
  "MTL4CommandQueue",
  "MTL4Compiler",
  "MTL4FunctionDescriptor",
  "MTL4LibraryFunctionDescriptor",
  "MTL4PipelineState",
  "MTL4RenderCommandEncoder",
  "MTL4RenderPass",
  "MTL4RenderPipeline",
  "MTLAllocation",
  "MTLBuffer",
  "MTLCommandEncoder",
  "MTLDevice",
  "MTLDrawable",
  "MTLEvent",
  "MTLGPUAddress",
  "MTLLibrary",
  "MTLPixelFormat",
  "MTLRenderCommandEncoder",
  "MTLRenderPass",
  "MTLRenderPipeline",
  "MTLResidencySet",
  "MTLResource",
  "MTLTexture",
  "MTLTypes",
  "dispatch2",
] }
objc2-quartz-core = { workspace = true, features = [
  "CADisplayLink",
  "CALayer",
  "CAMetalLayer",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-metal",
] }

[dev-dependencies]
morok-components.workspace = true
morok-css.workspace = true
morok-reactive.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "NSApplication",
  "NSEvent",
  "NSGraphicsContext",
  "NSPasteboard",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSDate",
  "NSGeometry",
  "NSNotification",
  "NSObjCRuntime",
  "NSRange",
  "NSRunLoop",
  "NSString",
] }

[[test]]
name = "accessibility_adapter"
harness = false

[[test]]
name = "display_link_idle"
harness = false

[[test]]
name = "event_translation"
harness = false

[[test]]
name = "text_input_client"
harness = false

[[test]]
name = "window_surface"
harness = false
