[workspace]
resolver = "3"
members = [
    "crates/style",
    "crates/css",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/supostat/morok"

[workspace.dependencies]
morok-style = { path = "crates/style", version = "=0.1.0" }
cssparser = "=0.38.0"
prettyplease = "=0.3.0"
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=3.0.9", features = ["full"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Keeps target/ small. Backtraces still name file and line in workspace crates;
# a debugger cannot inspect variables, and frames inside dependencies have no line numbers.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
