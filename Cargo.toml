[workspace]
resolver = "3"
members = [
    "crates/style",
    "crates/css",
    "crates/reactive",
    "crates/core",
    "crates/platform",
    "crates/components",
    "crates/morok",
    "crates/teststand",
    "crates/bench",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/supostat/morok"

[workspace.dependencies]
morok-style = { path = "crates/style", version = "=0.1.0" }
morok-css = { path = "crates/css", version = "=0.1.0" }
morok-reactive = { path = "crates/reactive", version = "=0.1.0" }
morok-core = { path = "crates/core", version = "=0.1.0" }
morok-platform = { path = "crates/platform", version = "=0.1.0" }
morok-components = { path = "crates/components", version = "=0.1.0" }
morok = { path = "crates/morok", version = "=0.1.0" }
accesskit = "=0.25.2"
accesskit_macos = "=0.27.2"
bytemuck = { version = "=1.25.2", features = ["derive"] }
chromiumoxide = { version = "=0.9.1", default-features = false, features = ["fetcher", "rustls", "zip8"] }
cssparser = "=0.38.0"
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std"] }
futures = "=0.3.34"
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-core-text = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std"] }
png = "=0.18.1"
prettyplease = "=0.3.0"
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
resvg = { version = "=0.49.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.11.1"
syn = { version = "=3.0.9", features = ["full"] }
taffy = { version = "=0.15.1", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "calc", "content_size"] }
tokio = { version = "=1.54.1", features = ["rt"] }
toml = "=1.1.8"
unicode-segmentation = "=1.13.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Keeps target/ small. Backtraces still name file and line in workspace crates;
# a debugger cannot inspect variables, and frames inside dependencies have no line numbers.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
